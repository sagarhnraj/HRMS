spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration/common

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}
